name: Cake
description: 'Cake (stylized CAKE) is a Stockholm, Sweden based maker of premium,
  lightweight, high-performance electric motorcycles and mopeds, built around a mission
  to accelerate the shift to a zero-emission society by combining excitement with
  responsibility. Its clean-mobility lineup spans commuter models (Makka, Osa), off-road
  bikes (Kalk, Bukk) and work-focused utility variants. Founded by Stefan Ytterborn
  and backed by Creandum, CAKE filed for bankruptcy in early 2024 and its brand and
  IP were acquired by Norway''s Brages Holding AS, which relaunched the company. Cake
  sells direct to consumers and through dealers at ridecake.com; it is a hardware and
  e-commerce brand with no public developer API surface.'
